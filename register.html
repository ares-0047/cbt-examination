<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Velocity</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <nav>
        <a class="brand" href="index.html" aria-label="Velocity home">
            <img class="brand-logo" src="assets/velocity-logo.png" alt="">
            <span>VELOCITY</span>
        </a>
        <div class="nav-links">
            <a href="index.html">Back to Home</a>
        </div>
    </nav>

    <main class="register-container">
        <div class="register-card">
            <h2 class="mb-2">Student Registration</h2>
            <p class="mb-4 description">Enter your details to proceed to the examination instructions.</p>
            
            <form id="registrationForm">
                <div class="form-group">
                    <label for="fullName">Full Name *</label>
                    <input type="text" id="fullName" name="fullName" required placeholder="e.g., John Doe">
                </div>

                <div class="form-group">
                    <label for="phoneNumber">Phone Number *</label>
                    <input type="tel" id="phoneNumber" name="phoneNumber" required placeholder="10-digit number" pattern="[0-9]{10}">
                    <small class="error-msg" id="phoneError">Please enter a valid 10-digit phone number.</small>
                </div>

                <div class="form-group">
                    <label for="qId">Q-ID (Roll Number/ID) *</label>
                    <input type="text" id="qId" name="qId" required placeholder="e.g., Q123456">
                </div>

                <div class="form-group">
                    <label for="email">Email Address (Optional)</label>
                    <input type="email" id="email" name="email" placeholder="e.g., john@example.com">
                </div>

                <div class="form-group">
                    <label for="examCategory">Examination *</label>
                    <select id="examCategory" name="examCategory" required>
                        <option value="" disabled selected>Select Examination</option>
                        <option value="GATE">GATE Mock Test</option>
                        <option value="CAT">CAT Mock Test</option>
                        <option value="IELTS">IELTS Practice Test</option>
                        <option value="Other">Other Competitive Exam</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn">Proceed to Instructions</button>
                </div>
                <div id="formError" class="error-msg text-center"></div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Velocity Mock Test Portal.</p>
    </footer>

    <script src="register.js"></script>
</body>
</html>
