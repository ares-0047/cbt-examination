<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Velocity</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <nav>
        <a class="brand" href="index.html" aria-label="Velocity home">
            <img class="brand-logo" src="velocity-logo.png" alt="">
            <span>VELOCITY ADMIN</span>
        </a>
        <div class="nav-links">
            <a href="index.html" class="no-auth-only">Back to Site</a>
            <a href="#" id="logoutBtn" style="display: none;">Logout</a>
        </div>
    </nav>

    <main class="container">
        <!-- LOGIN SECTION -->
        <div id="loginSection" class="admin-card">
            <h2 class="text-center mb-4">Administrator Login</h2>
            <form id="adminLoginForm">
                <div class="form-group mb-4">
                    <label>Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group mb-4">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
                <div id="loginError" class="error-msg text-center mt-2" style="display: none; color: #ff4d4d;"></div>
            </form>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="dashboardSection" style="display: none;">
            <div class="dashboard-header mb-4">
                <h2>Examination Results</h2>
                <button class="btn" onclick="fetchResults()">Refresh Data</button>
            </div>

            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Candidate Name</th>
                            <th>Q-ID</th>
                            <th>Exam Category</th>
                            <th>Score</th>
                            <th>Percentage</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTableBody">
                        <tr><td colspan="6" class="text-center">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="admin.js"></script>
</body>
</html>
